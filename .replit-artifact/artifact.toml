kind = "web"
previewPath = "/"
title = "AI Agent Marketplace"
version = "1.0.0"
id = "artifacts/agent-marketplace"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20102

[services.development]
run = "pnpm --filter @workspace/agent-marketplace run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/agent-marketplace", "run", "build" ]
publicDir = "artifacts/agent-marketplace/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20102"
BASE_PATH = "/"
